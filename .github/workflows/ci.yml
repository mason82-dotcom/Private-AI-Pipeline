name: Verify (offline, no network in code)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF text parser
        run: python -m pip install --only-binary=:all: pypdf==5.9.0
      - name: Python checks
        run: |
          python -m compileall -q gateway console tests
          python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check console/static/app.js
          node --check console/static/login.js
          node tests/test_chat_history.cjs
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Never publish credentials
        run: |
          test ! -e .env
          test ! -e gateway/memory.sqlite3
